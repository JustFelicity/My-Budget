:1px solid var(--line)}.btn.danger{background:#f6e6e5;color:var(--red)}.btn.full{width:100%}.btn.smallbtn{padding:8px 11px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fffdfaef;backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));}.tabs-inner{width:min(700px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.tab{background:transparent;color:#8c8289;padding:7px 2px;border-radius:12px;font-size:10px;font-weight:700}.tab .ico{display:block;font-size:19px;margin-bottom:3px}.tab.active{background:#eee5e1;color:var(--navy)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.list{display:flex;flex-direction:column;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item-title{font-weight:700;font-size:14px}.amount{font-weight:800;white-space:nowrap}.negative{color:var(--red)}.positive{color:var(--green)}.pill{font-size:10px;padding:5px 8px;border-radius:30px;background:#eee6e2;color:var(--slate);font-weight:700}.empty{text-align:center;padding:24px 10px;color:#897f86;font-size:13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:12px;font-weight:750;color:var(--slate)}input,select,textarea{width:100%;border:1px solid #ddd0cb;background:#fffdfa;border-radius:12px;padding:12px;color:var(--navy);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--slate);box-shadow:0 0 0 3px #4a4e6914}textarea{resize:vertical;min-height:72px}.chart-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.donut{width:160px;height:160px;max-width:48%;flex:0 0 auto}.legend{flex:1;min-width:145px}.legend-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:6px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}.history-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}.history-toolbar label{font-size:12px;font-weight:700;color:var(--slate);white-space:nowrap}.history-toolbar select{max-width:150px;padding:9px 11px}.month-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.month-card{text-align:left;min-height:74px;padding:12px 10px;border-radius:13px;background:#fffdfa;border:1px solid var(--line);color:var(--navy);display:flex;flex-direction:column;justify-content:center;gap:5px}.month-card.current{background:var(--navy);color:white;border-color:var(--navy)}.month-card.has-data:not(.current){border-color:var(--mauve);background:#f8f3f0}.month-card strong{display:block;font-size:13px}.month-card span{font-size:10px;opacity:.72}.month-card:disabled{opacity:.35;cursor:not-allowed;background:#eee9e6}.notice{background:#eee5e1;border:1px solid #dfd0cb;border-radius:16px;padding:13px;font-size:13px;margin-bottom:13px}.modalback{position:fixed;inset:0;background:#1515258c;z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{background:var(--cream);border-radius:24px 24px 18px 18px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 70px #0004}.modal h2{font-family:inherit;margin:0 0 16px;font-size:21px}.modalfoot{display:flex;gap:9px;margin-top:14px}.modalfoot>*{flex:1}.hidden{display:none!important}.onboard{min-height:100vh;display:grid;place-items:center;padding:20px}.onboardbox{max-width:570px;width:100%}.step{display:flex;gap:5px;margin:16px 0}.step i{height:4px;border-radius:9px;background:#ddd0cb;flex:1}.step i.done{background:var(--slate)}.report{background:white;color:#222;padding:22px;border-radius:15px}.report h2{color:#22223B;font-family:inherit}.report .metric{background:#f7f3f1}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:12px 17px;border-radius:14px;z-index:20;box-shadow:var(--shadow);font-size:13px;max-width:90%;text-align:center}.pulse{animation:pulse 1.3s infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px #c9ada755}}.footer-note{text-align:center;font-size:10px;color:#9a8c98;margin-top:20px}

<body>
<div id="root"></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const $=s=>document.querySelector(s), money=(n,c)=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(n)||0)+' '+(c||'FC');
const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const now=new Date(), currentKey=keyOf(now);
function keyOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function dateLocal(v){if(!v)return new Date();let [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d||1)}
function monthLabel(k){let [y,m]=k.split('-').map(Number);return MONTHS[m-1]+' '+y}
function uid(){return Math.random().toString(36).slice(2,10)}
function load(){try{return JSON.parse(localStorage.getItem('mybudget_v1'))||{}}catch(e){return {}}}

let db=load(), page='home', selectedMonth=currentKey, onboardingStep=0, monthSetupPending=false, draft={name:'',currency:'FC',salary:'',paidAt:new Date().toISOString().slice(0,10),fixed:[],palette:'rose'}, pendingDelete=null;
function save(){localStorage.setItem('mybudget_v1',JSON.stringify(db))}

const PALETTES={
 rose:{name:'Rose & indigo',description:'La palette originale',colors:['#F2E9E4','#C9ADA7','#9A8C98','#4A4E69','#22223B']},
 blue:{name:'Bleu glacier',description:'Bleus et nuances aquatiques',colors:['#C3E4F8','#BCE7EA','#61B3C9','#5EA5D1','#1C4968']},
 sage:{name:'Sauge naturelle',description:'Verts doux et tons végétaux',colors:['#F1F4ED','#DCE5D2','#A3B18A','#588157','#344E41']}
};
function activePalette(){return db.profile?.palette||'rose'}
function applyPalette(name){let p=PALETTES[name]?name:'rose';document.body.dataset.palette=p;let meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=PALETTES[p].colors[4];}
function paletteChoices(selected,context){return `<div class="palette-options">${Object.entries(PALETTES).map(([key,p])=>`<button type="button" class="palette-choice ${selected===key?'selected':''}" onclick="${context==='setup'?`chooseSetupPalette('${key}')`:`choosePalette('${key}')`}"><span class="palette-swatches">${p.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</span><span><strong>${p.name}</strong><small>${p.description}</small></span></button>`).join('')}</div>`}
function chooseSetupPalette(key){draft.name=$('#obName')?.value||draft.name;draft.currency=$('#obCurrency')?.value||draft.currency;draft.palette=key;renderOnboarding()}
function choosePalette(key){if(!PALETTES[key])return;db.profile.palette=key;save();applyPalette(key);render();toast('Palette mise à jour.');}

function initMonth(k,salary,paidAt){if(!db.months)db.months={};if(!db.months[k])db.months[k]={salary:Number(salary)||0,paidAt:paidAt||new Date().toISOString().slice(0,10),fixedSnapshot:(db.fixed||[]).map(x=>({...x,id:uid()})),transactions:[],savings:[],openingSavings:0};}
function month(k){initMonth(k,0);return db.months[k]}
function txSum(m){return m.transactions.reduce((s,t)=>s+Number(t.amount||0),0)}
function savingNet(m){return m.savings.reduce((s,t)=>s+(t.type==='in'?1:-1)*Number(t.amount||0),0)}
function balance(m){return Number(m.salary||0)-fixedTotal(m)-txSum(m)-m.savings.filter(x=>x.type==='in').reduce((s,t)=>s+Number(t.amount||0),0)+m.savings.filter(x=>x.type==='out').reduce((s,t)=>s+Number(t.amount||0),0)}
function fixedTotal(m){return m.fixedSnapshot.reduce((s,x)=>s+Number(x.amount||0),0)}
function allCategories(m){let a={};m.fixedSnapshot.forEach(x=>a[x.name]=(a[x.name]||0)+Number(x.amount||0));m.transactions.forEach(x=>a[x.category]=(a[x.category]||0)+Number(x.amount||0));return a}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('#toastRoot').innerHTML='<div class="toast">'+escapeHtml(s)+'</div>';setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
function showModal(html){$('#modalRoot').innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>'}
function closeModal(){$('#modalRoot').innerHTML=''}
function ensure(){if(!db.profile){renderOnboarding();return false}if(!db.months)db.months={};if(!db.months[currentKey]){initMonth(currentKey,0);monthSetupPending=true;save()}return true}
function renderOnboarding(){
applyPalette(draft.palette||'rose');
let steps=['Profil','Salaire','Dépenses fixes'];
let body='';
if(onboardingStep===0)body=`<div class="eyebrow">Profil</div><h1>Votre profil</h1><div class="field"><label>Nom</label><input id="obName" placeholder="Votre prénom et nom" value="${escapeHtml(draft.name)}"></div><div class="field"><label>Devise</label><select id="obCurrency"><option ${draft.currency==='FC'?'selected':''}>FC</option><option ${draft.currency==='USD'?'selected':''}>USD</option><option ${draft.currency==='EUR'?'selected':''}>EUR</option></select></div><div class="field"><label>Palette de couleurs</label>${paletteChoices(draft.palette,'setup')}</div>`;
if(onboardingStep===1)body=`<div class="eyebrow">Étape 2 sur 3</div><h1>Salaire</h1><div class="field"><label>Montant du salaire</label><input id="obSalary" type="number" min="0" step="any" placeholder="Ex. 750000" value="${draft.salary}"></div><div class="field"><label>Date de paiement</label><input id="obPaid" type="date" value="${draft.paidAt}"></div>`;
if(onboardingStep===2)body=`<div class="eyebrow">Étape 3 sur 3</div><h1>Dépenses fixes</h1><div id="obFixed">${draft.fixed.map((x,i)=>fixedDraftRow(x,i)).join('')}</div><button class="btn secondary full" onclick="addDraftFixed()">＋ Ajouter une dépense fixe</button>`;
$('#root').innerHTML=`<div class="onboard"><div class="onboardbox"><div class="brand">My <span>Budget</span></div><div class="step">${steps.map((x,i)=>`<i class="${i<=onboardingStep?'done':''}"></i>`).join('')}</div><div class="card">${body}<div class="modalfoot">${onboardingStep>0?'<button class="btn ghost" onclick="onboardBack()">Retour</button>':''}<button class="btn" onclick="onboardNext()">${onboardingStep===2?'Créer mon espace':'Continuer'}</button></div></div></div></div>`;
}
function fixedDraftRow(x,i){return `<div class="formgrid draftrow" style="margin-bottom:8px"><input placeholder="Nom de la dépense" class="draftname" value="${escapeHtml(x.name)}"><input type="number" min="0" placeholder="Montant" class="draftamount" value="${x.amount}"></div>`}
function collectDraft(){let rows=[...document.querySelectorAll('.draftrow')];draft.fixed=rows.map(r=>({name:r.querySelector('.draftname').value.trim(),amount:Number(r.querySelector('.draftamount').value)||0})).filter(x=>x.name&&x.amount>0)}
function addDraftFixed(){collectDraft();draft.fixed.push({name:'',amount:''});renderOnboarding()}
function onboardBack(){if(onboardingStep===2)collectDraft();onboardingStep--;renderOnboarding()}
function onboardNext(){
if(onboardingStep===0){draft.name=$('#obName').value.trim();draft.currency=$('#obCurrency').value;if(!draft.name)return toast('Veuillez saisir votre nom.')}
if(onboardingStep===1){draft.salary=$('#obSalary').value;draft.paidAt=$('#obPaid').value;if(!draft.salary||Number(draft.salary)<=0||!draft.paidAt)return toast('Indiquez un salaire et une date de paiement valides.')}
if(onboardingStep===2){collectDraft();db.profile={name:draft.name,currency:draft.currency,palette:draft.palette||'rose'};applyPalette(db.profile.palette);db.fixed=draft.fixed.map(x=>({...x,id:uid()}));initMonth(currentKey,draft.salary,draft.paidAt);month(currentKey).fixedSnapshot=db.fixed.map(x=>({...x,id:uid()}));save();page='home';render();return}
onboardingStep++;renderOnboarding()
}
function nav(){return `<nav class="tabs"><div class="tabs-inner">${[['home','⌂','Accueil'],['moves','↕','Mouvements'],['savings','◈','Épargne'],['history','▦','Historique'],['settings','⚙','Réglages']].map(([p,i,l])=>`<button class="tab ${page===p?'active':''}" onclick="go('${p}')"><span class="ico">${i}</span>${l}</button>`).join('')}</div></nav>`}
function go(p){page=p;if(p==='home')selectedMonth=currentKey;render()}
function render(){
if(!ensure())return;
applyPalette(activePalette());
let m=month(selectedMonth), isCurrent=selectedMonth===currentKey;
let content=page==='home'?homeView(m,isCurrent):page==='moves'?movesView(m):page==='savings'?savingsView(m):page==='history'?historyView():settingsView();
$('#root').innerHTML=`<div class="app"><header class="top"><div><div class="brand">My <span>Budget</span></div><div class="small muted">${escapeHtml(db.profile.name)} · ${monthLabel(selectedMonth)}</div></div><div class="actions"><button class="btn ghost smallbtn" onclick="openNotifications()">♧ Rappels</button></div></header>${content}</div>${nav()}`;
if(page==='home')drawChart(m);
}
function hero(m){return `<div class="card hero"><div class="eyebrow">Solde disponible · ${monthLabel(selectedMonth)}</div><div class="balance">${money(balance(m),db.profile.currency)}</div><div class="hero-meta"><span>Départ : <strong>${money(m.salary,db.profile.currency)}</strong></span><span>Payé(e) le : <strong>${dateLocal(m.paidAt).toLocaleDateString('fr-FR')}</strong></span></div></div>`}
function homeView(m,isCurrent){
let spent=txSum(m), savIn=m.savings.filter(x=>x.type==='in').reduce((s,x)=>s+Number(x.amount),0), savOut=m.savings.filter(x=>x.type==='out').reduce((s,x)=>s+Number(x.amount),0);
let fixedUsed=m.fixedSnapshot.reduce((s,f)=>s+Number(f.amount),0);
return `<div class="dashboard"><div>${hero(m)}<div class="grid2"><div class="metric"><div class="eyebrow">Dépenses enregistrées</div><div class="num negative">${money(spent+fixedUsed,db.profile.currency)}</div><div class="small muted">${m.fixedSnapshot.length} charge(s) fixe(s) · ${m.transactions.length} mouvement(s)</div></div><div class="metric"><div class="eyebrow">Épargne nette du mois</div><div class="num positive">${money(savIn-savOut,db.profile.currency)}</div><div class="small muted">+${money(savIn,db.profile.currency)} / −${money(savOut,db.profile.currency)}</div></div></div></div>
<div><div class="card"><div class="section-head" style="margin-top:0"><h2>Répartition du budget</h2><span class="pill">${monthLabel(selectedMonth)}</span></div><div class="chart-wrap"><canvas id="donut" class="donut" width="320" height="320"></canvas><div class="legend" id="legend"></div></div></div></div>
<div class="wide"><div class="section-head"><h2>Dépenses fixes</h2><button class="btn ghost smallbtn" onclick="go('settings')">Gérer</button></div><div class="card"><div class="list">${m.fixedSnapshot.length?m.fixedSnapshot.map(f=>`<div class="item"><div><div class="item-title">${escapeHtml(f.name)}</div><div class="small muted">Mensuel</div></div><div class="amount">${money(f.amount,db.profile.currency)}</div></div>`).join(''):'<div class="empty">Aucune dépense fixe configurée.</div>'}</div></div></div>
<div><div class="section-head"><h2>Derniers mouvements</h2><button class="btn ghost smallbtn" onclick="go('moves')">Tout voir</button></div><div class="card">${recentTransactions(m)}</div></div>
<div><div class="section-head"><h2>Mon épargne</h2><button class="btn ghost smallbtn" onclick="go('savings')">Ouvrir →</button></div><div class="card"><div class="eyebrow">Épargne nette de ${monthLabel(selectedMonth)}</div><div class="num positive" style="font-size:25px;font-weight:850;margin:8px 0">${money(savingNet(m),db.profile.currency)}</div></div></div>
<div class="wide actions"><button class="btn" onclick="openExpense()">＋ Ajouter une dépense</button><button class="btn secondary" onclick="openSaving('in')">＋ Épargner</button></div></div>`;
}
const palette=['#22223B','#4A4E69','#9A8C98','#C9ADA7','#b58b72','#7d9b91','#d0ad65','#718096','#aa6671'];
function drawChart(m){let cats=allCategories(m),entries=Object.entries(cats),canvas=$('#donut');if(!canvas)return;let ctx=canvas.getContext('2d'),total=entries.reduce((s,x)=>s+x[1],0),cx=160,cy=160,r=126,inner=78;ctx.clearRect(0,0,320,320);if(!entries.length){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='#e7ddda';ctx.lineWidth=38;ctx.stroke();ctx.fillStyle='#4A4E69';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText('0',cx,cy+7)}else{let a=-Math.PI/2;entries.forEach(([name,val],i)=>{let b=a+(total?val/total:0)*Math.PI*2;ctx.beginPath();ctx.arc(cx,cy,r,a,b);ctx.arc(cx,cy,inner,b,a,true);ctx.closePath();ctx.fillStyle=palette[i%palette.length];ctx.fill();a=b});ctx.fillStyle='#22223B';ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillText(Math.round(total?total:0).toLocaleString('fr-FR'),cx,cy+4);ctx.font='11px sans-serif';ctx.fillStyle='#817781';ctx.fillText('DÉPENSÉ',cx,cy+22)}
$('#legend').innerHTML=entries.length?entries.map(([n,v],i)=>`<div class="legend-row"><span><i class="dot" style="background:${palette[i%palette.length]}"></i>${escapeHtml(n)}</span><strong>${total?Math.round(v/total*100):0}%</strong></div>`).join(''):'<div class="small muted">Les catégories apparaîtront ici au fil des mouvements.</div>'}
function recentTransactions(m){let arr=m.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);return arr.length?`<div class="list">${arr.map(t=>`<div class="item"><div><div class="item-title">${escapeHtml(t.description)}</div><div class="small muted">${escapeHtml(t.category)} · ${dateLocal(t.date).toLocaleDateString('fr-FR')}</div></div><div class="amount negative">− ${money(t.amount,db.profile.currency)}</div></div>`).join('')}</div>`:'<div class="empty">Aucun mouvement pour le moment. Votre suivi commencera ici.</div>'}
function movesView(m){return `<div class="section-head"><h2>Mouvements · ${monthLabel(selectedMonth)}</h2><button class="btn" onclick="openExpense()">＋ Ajouter</button></div><div class="card"><div class="grid2"><div class="metric"><div class="eyebrow">Total dépensé</div><div class="num negative">${money(txSum(m),db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Opérations</div><div class="num">${m.transactions.length}</div></div></div></div><div class="card"><div class="section-head" style="margin-top:0"><h2>Historique des dépenses</h2></div>${m.transactions.length?`<div class="list">${m.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="item"><div style="min-width:0"><div class="item-title">${escapeHtml(t.description)}</div><div class="small muted">${escapeHtml(t.category)} · ${dateLocal(t.date).toLocaleDateString('fr-FR')}</div>${t.note?`<div class="small muted">${escapeHtml(t.note)}</div>`:''}</div><div style="text-align:right"><div class="amount negative">− ${money(t.amount,db.profile.currency)}</div><div class="actions" style="justify-content:flex-end;margin-top:6px"><button class="btn ghost smallbtn" onclick="editExpense('${t.id}')">Modifier</button><button class="btn danger smallbtn" onclick="deleteTx('${t.id}')">×</button></div></div></div>`).join('')}</div>`:'<div class="empty">Aucune dépense enregistrée pour ce mois.</div>'}</div>`}
function totalSavings(){let n=0;Object.values(db.months||{}).forEach(m=>n+=savingNet({savings:Array.isArray(m.savings)?m.savings:[]}));return n}
function savingsView(m){
 const keys=Object.keys(db.months||{}).filter(k=>db.months[k]&&Array.isArray(db.months[k].savings)).sort().reverse();
 const byMonth=keys.map(k=>{let x=db.months[k],ins=x.savings.filter(t=>t.type==='in').reduce((a,t)=>a+Number(t.amount||0),0),outs=x.savings.filter(t=>t.type==='out').reduce((a,t)=>a+Number(t.amount||0),0);return {k,ins,outs,net:ins-outs}}).filter(x=>x.ins||x.outs);
 const rows=byMonth.map(x=>`<div class="item"><div><div class="item-title">${monthLabel(x.k)}</div><div class="small muted">Dépôts : ${money(x.ins,db.profile.currency)} · Retraits : ${money(x.outs,db.profile.currency)}</div></div><div class="amount ${x.net>=0?'positive':'negative'}">${money(x.net,db.profile.currency)}</div></div>`).join('');
 let all=keys.flatMap(k=>(db.months[k].savings||[]).map(t=>({...t,month:t.month||k}))).sort((a,b)=>b.date.localeCompare(a.date));
 let movements=all.map(t=>`<div class="item"><div><div class="item-title">${escapeHtml(t.description)}</div><div class="small muted">Origine : ${monthLabel(t.month)} · ${dateLocal(t.date).toLocaleDateString('fr-FR')}</div></div><div style="text-align:right"><div class="amount ${t.type==='in'?'positive':'negative'}">${t.type==='in'?'+':'−'} ${money(t.amount,db.profile.currency)}</div><div class="actions" style="justify-content:flex-end;margin-top:6px"><button class="btn ghost smallbtn" onclick="editSaving('${t.month}','${t.id}')">Modifier</button><button class="btn danger smallbtn" onclick="deleteSaving('${t.month}','${t.id}')">×</button></div></div></div>`).join('');
 let carry=Number(m.carryoverAmount||0),source=m.carryoverFrom;
 return `<div class="section-head"><h2>Mon épargne</h2><span class="pill">${monthLabel(selectedMonth)}</span></div><div class="card hero"><div class="eyebrow">Épargne totale cumulée</div><div class="balance">${money(totalSavings(),db.profile.currency)}</div><div class="hero-meta">Le total reste dans l'épargne, sans augmenter le solde disponible pour les dépenses.</div></div><div class="grid2"><div class="metric"><div class="eyebrow">Épargne du mois actuel</div><div class="num positive">${money(savingNet(m),db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Report reçu</div><div class="num">${money(carry,db.profile.currency)}</div><div class="small muted">${source?`Provenant de ${monthLabel(source)}`:'Aucun report accepté'}</div></div></div><div class="grid2" style="margin:12px 0"><button class="btn" onclick="openSaving('in')">＋ Ajouter à l’épargne</button><button class="btn secondary" onclick="openSaving('out')">− Retirer</button></div><div class="section-head"><h2>Épargne par mois d'origine</h2></div><div class="card">${rows?`<div class="list">${rows}</div>`:'<div class="empty">Aucune épargne enregistrée.</div>'}</div><div class="section-head"><h2>Tous les mouvements</h2></div><div class="card">${movements?`<div class="list">${movements}</div>`:'<div class="empty">Aucun mouvement d’épargne.</div>'}</div><div class="notice">Un report conserve son mois d'origine : il n'est pas compté comme un nouveau dépôt. Les retraits diminuent le total global. L'épargne reste séparée de l'argent disponible pour les dépenses.</div>`;
}
let historyYear=now.getFullYear();
function hasMonthData(k){let m=db.months&&db.months[k];return !!(m&&(m.createdManually||Number(m.salary||0)>0||(m.transactions||[]).length||(m.savings||[]).length));}
function historyMonthCards(){
 const year=historyYear, currentYear=now.getFullYear(), currentMonth=now.getMonth()+1;
 const available=MONTHS.map((name,i)=>({name,n:i+1})).filter(x=>year<currentYear||x.n<=currentMonth).reverse();
 return available.map(({name,n})=>{
  const k=year+'-'+String(n).padStart(2,'0'), isCurrent=k===currentKey, saved=hasMonthData(k);
  const subtitle=hasMonthData(k)?'Données saisies':'À compléter';
  return `<button class="month-card ${isCurrent?'current':''} ${saved?'has-data':''}" onclick="openReport('${k}')"><strong>${isCurrent?'★ ':''}${name}</strong><span>${subtitle}</span></button>`;
 }).join('');
}
function renderHistoryYear(value){
 historyYear=Math.max(2000,Math.min(now.getFullYear(),Number(value)||now.getFullYear()));
 const grid=$('#historyMonths');if(grid)grid.innerHTML=historyMonthCards();
}
function historyView(){
 const years=Array.from({length:now.getFullYear()-2000+1},(_,i)=>now.getFullYear()-i);
 return `<div class="section-head"><h2>Historique</h2><button class="btn secondary smallbtn" onclick="annualReport(historyYear)">Bilan annuel</button></div><div class="history-toolbar"><label for="historyYear">Année consultée</label><select id="historyYear" onchange="renderHistoryYear(this.value)">${years.map(y=>`<option value="${y}" ${y===historyYear?'selected':''}>${y}</option>`).join('')}</select></div><div class="month-grid" id="historyMonths">${historyMonthCards()}</div>`;
}
function settingsView(){return `<div class="section-head"><h2>Paramètres</h2></div><div class="card"><div class="eyebrow">Thème</div><h2 style="margin:5px 0">Palette de couleurs</h2><div class="small muted">Modifiable à tout moment, sans toucher aux données.</div>${paletteChoices(activePalette(),'settings')}</div><div class="card"><div class="eyebrow">Profil</div><div class="field"><label>Nom affiché</label><input id="setName" value="${escapeHtml(db.profile.name)}"></div><div class="field"><label>Devise</label><select id="setCurrency">${['FC','USD','EUR'].map(c=>`<option ${db.profile.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><button class="btn" onclick="saveProfile()">Enregistrer le profil</button></div><div class="card"><div class="row"><div><h2 style="margin:0">Dépenses fixes</h2><div class="small muted">Modifiables uniquement depuis ce menu.</div></div><button class="btn smallbtn" onclick="openFixed()">＋ Ajouter</button></div><div class="list" style="margin-top:10px">${(db.fixed||[]).length?db.fixed.map(f=>`<div class="item"><div><div class="item-title">${escapeHtml(f.name)}</div><div class="small muted">${money(f.amount,db.profile.currency)}</div></div><div class="actions"><button class="btn ghost smallbtn" onclick="editFixed('${f.id}')">Modifier</button><button class="btn danger smallbtn" onclick="removeFixed('${f.id}')">×</button></div></div>`).join(''):'<div class="empty">Aucune dépense fixe.</div>'}</div></div><div class="card"><h2 style="margin-top:0">Nouveau mois</h2><p class="small muted">Au début d'un nouveau mois, indiquez le salaire reçu et sa date de paiement. Les dépenses fixes configurées seront reprises dans le nouveau mois.</p><button class="btn secondary" onclick="openNewMonth()">Configurer le mois actuel</button></div><div class="card"><h2 style="margin-top:0">Sauvegarde des données</h2><p class="small muted">Exportez une copie de sécurité. Le fichier contient votre profil et vos mouvements financiers.</p><div class="actions"><button class="btn secondary" onclick="backup()">Exporter la sauvegarde</button><label class="btn ghost" style="display:inline-flex;align-items:center">Importer<input type="file" accept="application/json" onchange="restore(event)" hidden></label></div></div><div class="card"><h2 style="margin-top:0">Rappels</h2><p class="small muted">Autorisez les notifications du navigateur si vous souhaitez recevoir les rappels lorsque l'application est ouverte. Les rappels à heure fixe ne peuvent pas être garantis par GitHub Pages seul.</p><button class="btn secondary" onclick="requestNotify()">Activer les notifications</button></div>`}

function openExpense(id){let m=month(selectedMonth),t=id?m.transactions.find(x=>x.id===id):null;let cats=[...new Set([...(m.fixedSnapshot||[]).map(x=>x.name),...m.transactions.map(x=>x.category)])];showModal(`<h2>${t?'Modifier la dépense':'Nouvelle dépense'}</h2><div class="field"><label>Description</label><input id="eDesc" placeholder="Ex. Courses alimentaires" value="${escapeHtml(t?.description||'')}"></div><div class="formgrid"><div class="field"><label>Montant</label><input id="eAmount" type="number" min="1" value="${t?.amount||''}" placeholder="0"></div><div class="field"><label>Date</label><input id="eDate" type="date" value="${t?.date||new Date().toISOString().slice(0,10)}"></div></div><div class="field"><label>Catégorie</label><input id="eCat" list="catlist" placeholder="Ex. Santé" value="${escapeHtml(t?.category||'')}"><datalist id="catlist">${cats.map(c=>`<option value="${escapeHtml(c)}">`).join('')}</datalist></div><div class="field"><label>Note (facultatif)</label><textarea id="eNote">${escapeHtml(t?.note||'')}</textarea></div><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveExpense('${id||''}')">Enregistrer</button></div>`)}
function editExpense(id){openExpense(id)}
function saveExpense(id){let m=month(selectedMonth),description=$('#eDesc').value.trim(),amount=Number($('#eAmount').value),date=$('#eDate').value,category=$('#eCat').value.trim();if(!description||!category||!date||amount<=0)return toast('Complétez la description, la catégorie, la date et un montant positif.');let [y,mo]=date.split('-').map(Number);if(y+'-'+String(mo).padStart(2,'0')!==selectedMonth)return toast('La date doit appartenir au mois consulté.');let obj={id:id||uid(),description,amount,date,category,note:$('#eNote').value.trim()};if(id)m.transactions=m.transactions.map(x=>x.id===id?obj:x);else m.transactions.push(obj);save();closeModal();render();toast('Dépense enregistrée.')}
function deleteTx(id){let t=month(selectedMonth).transactions.find(x=>x.id===id);showModal(`<h2>Supprimer ce mouvement ?</h2><p>« ${escapeHtml(t?.description)} » — ${money(t?.amount,db.profile.currency)}</p><p class="small muted">Cette opération ne peut pas être annulée.</p><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Garder</button><button class="btn danger" onclick="confirmDelete('${id}')">Supprimer</button></div>`)}
function confirmDelete(id){let m=month(selectedMonth);m.transactions=m.transactions.filter(x=>x.id!==id);save();closeModal();render();toast('Mouvement supprimé.')}
function openSaving(type,k=selectedMonth){let defaultDate=(k===currentKey?new Date():new Date(Number(k.slice(0,4)),Number(k.slice(5,7))-1,15)).toISOString().slice(0,10);showModal(`<h2>${type==='in'?'Ajouter à l’épargne':'Retirer de l’épargne'}</h2><div class="field"><label>Description du mouvement</label><input id="sDesc" placeholder="${type==='in'?'Ex. Épargne mensuelle':'Ex. Retrait imprévu'}"></div><div class="formgrid"><div class="field"><label>Montant</label><input id="sAmount" type="number" min="1" placeholder="0"></div><div class="field"><label>Date</label><input id="sDate" type="date" value="${defaultDate}"></div></div><div class="small muted">${type==='in'?'Le montant sera déduit du solde disponible du mois.':'Le montant sera ajouté au solde disponible du mois.'}</div><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveSaving('${type}','${k}')">Confirmer</button></div>`)}
function saveSaving(type,k=selectedMonth){let description=$('#sDesc').value.trim(),amount=Number($('#sAmount').value),date=$('#sDate').value;if(!description||amount<=0||!date)return toast('Complétez les informations du mouvement.');if(date.slice(0,7)!==k)return toast('La date doit appartenir au mois consulté.');if(k>currentKey)return toast('Impossible d’enregistrer un mouvement dans le futur.');let m=month(k);if(type==='out'&&amount>totalSavings())return toast('Le retrait dépasse l’épargne totale enregistrée.');m.savings.push({id:uid(),type,description,amount,date,month:k});save();closeModal();selectedMonth=k;render();toast('Mouvement d’épargne enregistré.')}
function editSaving(k,id){let s=month(k).savings.find(x=>x.id===id);if(!s)return;showModal(`<h2>Modifier le mouvement d'épargne</h2><div class="field"><label>Description</label><input id="esDesc" value="${escapeHtml(s.description)}"></div><div class="field"><label>Montant</label><input id="esAmount" type="number" min="1" value="${s.amount}"></div><div class="field"><label>Date</label><input id="esDate" type="date" value="${s.date}"></div><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveEditedSaving('${k}','${id}')">Enregistrer</button></div>`)}
function saveEditedSaving(k,id){let s=month(k).savings.find(x=>x.id===id),description=$('#esDesc').value.trim(),amount=Number($('#esAmount').value),date=$('#esDate').value;if(!description||amount<=0||!date||date.slice(0,7)!==k)return toast('Vérifiez les informations et la date.');s.description=description;s.amount=amount;s.date=date;save();closeModal();render();toast('Mouvement modifié.')}
function deleteSaving(k,id){showModal(`<h2>Supprimer ce mouvement d'épargne ?</h2><p>Cette opération modifiera le solde d'épargne et le solde disponible.</p><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn danger" onclick="month('${k}').savings=month('${k}').savings.filter(x=>x.id!=='${id}');save();closeModal();render()">Supprimer</button></div>`)}
function openFixed(id){let f=id?db.fixed.find(x=>x.id===id):null;showModal(`<h2>${f?'Modifier':'Ajouter'} une dépense fixe</h2><div class="field"><label>Nom de la dépense</label><input id="fName" value="${escapeHtml(f?.name||'')}" placeholder="Ex. Loyer"></div><div class="field"><label>Montant mensuel</label><input id="fAmount" type="number" min="1" value="${f?.amount||''}" placeholder="0"></div><p class="small muted">La modification s'appliquera au mois actuel et aux prochains mois configurés. Les anciennes fiches conserveront leur configuration enregistrée.</p><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveFixed('${id||''}')">Enregistrer</button></div>`)}
function editFixed(id){openFixed(id)}
function saveFixed(id){let name=$('#fName').value.trim(),amount=Number($('#fAmount').value);if(!name||amount<=0)return toast('Saisissez un nom et un montant positif.');if(id)db.fixed=db.fixed.map(x=>x.id===id?{...x,name,amount}:x);else db.fixed.push({id:uid(),name,amount});month(currentKey).fixedSnapshot=db.fixed.map(x=>({...x,id:uid()}));save();closeModal();render();toast('Dépense fixe mise à jour.')}
function removeFixed(id){let f=db.fixed.find(x=>x.id===id);showModal(`<h2>Retirer cette dépense fixe ?</h2><p>${escapeHtml(f?.name)} sera retirée des configurations futures. Les anciens mois ne seront pas modifiés.</p><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn danger" onclick="db.fixed=db.fixed.filter(x=>x.id!=='${id}');month(currentKey).fixedSnapshot=db.fixed.map(x=>({...x,id:uid()}));save();closeModal();render()">Retirer</button></div>`)}
function saveProfile(){let n=$('#setName').value.trim();if(!n)return toast('Le nom ne peut pas être vide.');db.profile.name=n;db.profile.currency=$('#setCurrency').value;save();render();toast('Profil mis à jour.')}
function openNewMonth(){let m=month(currentKey);showModal(`<h2>Configuration de ${monthLabel(currentKey)}</h2><div class="field"><label>Salaire reçu ce mois</label><input id="nmSalary" type="number" min="0" value="${m.salary||''}" placeholder="Montant reçu"></div><div class="field"><label>Date réelle de paiement</label><input id="nmDate" type="date" value="${m.paidAt||new Date().toISOString().slice(0,10)}"></div><p class="small muted">Les dépenses fixes actuelles seront copiées dans ce mois. Vérifiez-les ensuite dans votre tableau de bord.</p><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveNewMonth()">Enregistrer</button></div>`)}
function saveNewMonth(){let m=month(currentKey),salary=Number($('#nmSalary').value),paid=$('#nmDate').value;if(salary<0||!paid)return toast('Vérifiez le salaire et la date.');m.salary=salary;m.paidAt=paid;if(!m.fixedSnapshot.length)m.fixedSnapshot=db.fixed.map(x=>({...x,id:uid()}));save();closeModal();render();toast('Mois configuré.')}
function openReport(k){
 if(!hasMonthData(k)){showModal(`<div class="eyebrow">Historique · ${monthLabel(k)}</div><h2>Aucune fiche disponible</h2><p>Aucune donnée n'a été enregistrée pour ${monthLabel(k)}. Rien n'a été repris d'un autre mois.</p><p class="small muted">Vous pouvez créer maintenant une fiche vierge et y saisir les informations de vos notes : salaire, date de paiement, dépenses fixes, dépenses ponctuelles et épargne.</p><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Retour</button><button class="btn" onclick="createMonthFiche('${k}')">Créer la fiche de ce mois</button></div>`);return;}
 let m=db.months[k],cats=allCategories(m),total=Object.values(cats).reduce((a,b)=>a+b,0),savIn=m.savings.filter(x=>x.type==='in').reduce((s,x)=>s+Number(x.amount||0),0),savOut=m.savings.filter(x=>x.type==='out').reduce((s,x)=>s+Number(x.amount||0),0),tx=m.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)),fixed=fixedTotal(m);
 let txRows=tx.length?tx.map(t=>`<div class="item"><span>${dateLocal(t.date).toLocaleDateString('fr-FR')} · ${escapeHtml(t.description)} <small>(${escapeHtml(t.category)})</small></span><span><strong>− ${money(t.amount,db.profile.currency)}</strong> <button class="btn ghost smallbtn" onclick="closeModal();selectedMonth='${k}';openExpense('${t.id}')">Modifier</button></span></div>`).join(''):'<p>Aucune dépense ponctuelle enregistrée.</p>';
 let fixedRows=m.fixedSnapshot.length?m.fixedSnapshot.map(f=>`<div class="item"><span>${escapeHtml(f.name)}</span><strong>${money(f.amount,db.profile.currency)}</strong></div>`).join(''):'<p>Aucune dépense fixe enregistrée.</p>';
 let savRows=m.savings.length?m.savings.map(v=>`<div class="item"><span>${dateLocal(v.date).toLocaleDateString('fr-FR')} · ${escapeHtml(v.description)}</span><strong>${v.type==='in'?'+':'−'} ${money(v.amount,db.profile.currency)}</strong></div>`).join(''):'<p>Aucun mouvement d’épargne.</p>';
 let html=`<div class="row no-print"><button class="btn ghost smallbtn" onclick="closeModal()">← Historique</button><div class="actions"><button class="btn ghost smallbtn" onclick="editMonthInfo('${k}')">Modifier salaire</button><span class="pill">${monthLabel(k)}</span></div></div><div class="report" id="printReport"><div class="eyebrow">My Budget · Fiche mensuelle</div><h2 style="margin:5px 0">${monthLabel(k)}</h2><p style="font-size:12px;color:#777">Bilan financier personnel de ${escapeHtml(db.profile.name)}</p><div class="card hero"><div class="eyebrow">Solde final disponible</div><div class="balance">${money(balance(m),db.profile.currency)}</div><div class="hero-meta"><span>Salaire initial : <strong>${money(m.salary,db.profile.currency)}</strong></span><span>Payé le : <strong>${m.paidAt?dateLocal(m.paidAt).toLocaleDateString('fr-FR'):'Non renseignée'}</strong></span></div></div><div class="grid2"><div class="metric"><div class="eyebrow">Dépenses ponctuelles</div><div class="num">${money(txSum(m),db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Dépenses fixes</div><div class="num">${money(fixed,db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Épargne déposée ce mois</div><div class="num">${money(savIn,db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Retraits d'épargne</div><div class="num">${money(savOut,db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Report d'épargne reçu</div><div class="num">${money(m.carryoverAmount||0,db.profile.currency)}</div><div class="small muted">${m.carryoverFrom?`Origine : ${monthLabel(m.carryoverFrom)}`:'Aucun report'}</div></div></div><div class="row"><h3>Dépenses fixes</h3><button class="btn ghost smallbtn no-print" onclick="editMonthFixed('${k}')">Modifier</button></div>${fixedRows}<div class="row"><h3>Dépenses ponctuelles</h3><button class="btn ghost smallbtn no-print" onclick="closeModal();selectedMonth='${k}';openExpense()">＋ Ajouter</button></div>${txRows}<div class="row"><h3>Mouvements d'épargne</h3><button class="btn ghost smallbtn no-print" onclick="openSavingForMonth('${k}')">＋ Dépôt</button></div>${savRows}<p style="font-size:10px;color:#888;margin-top:24px">Document généré avec My Budget · Les montants sont basés sur les opérations enregistrées.</p></div><div class="modalfoot no-print"><button class="btn ghost" onclick="closeModal()">Fermer</button><button class="btn" onclick="exportMonthlyPDF('${k}')">Télécharger la fiche PDF</button></div>`;showModal(html);
}
function createMonthFiche(k){db.months=db.months||{};db.months[k]={salary:0,paidAt:'',fixedSnapshot:[],transactions:[],savings:[],openingSavings:0,createdManually:true};save();closeModal();openReport(k);}
function editMonthFixed(k){let m=db.months[k];showModal(`<h2>Dépenses fixes · ${monthLabel(k)}</h2><p class="small muted">Ces montants ne modifieront que la fiche de ce mois.</p><div id="mfRows">${m.fixedSnapshot.map((f,i)=>`<div class="formgrid" style="margin-bottom:8px"><input id="mfn${i}" value="${escapeHtml(f.name)}" placeholder="Nom"><input id="mfa${i}" type="number" min="0" value="${f.amount}"></div>`).join('')}</div><div class="field"><label>Ajouter une dépense fixe</label><input id="mfNewName" placeholder="Nom de la dépense"></div><div class="field"><input id="mfNewAmount" type="number" min="0" placeholder="Montant"></div><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveMonthFixed('${k}',${m.fixedSnapshot.length})">Enregistrer</button></div>`);}
function saveMonthFixed(k,n){let m=db.months[k],arr=[];for(let i=0;i<n;i++){let name=$('#mfn'+i).value.trim(),amount=Number($('#mfa'+i).value);if(name&&amount>0)arr.push({id:uid(),name,amount});}let name=$('#mfNewName').value.trim(),amount=Number($('#mfNewAmount').value);if(name&&amount>0)arr.push({id:uid(),name,amount});m.fixedSnapshot=arr;save();closeModal();openReport(k);}
function openSavingForMonth(k){closeModal();selectedMonth=k;openSaving('in',k);}

// Générateur PDF local : aucune bibliothèque distante, aucun envoi de données.
function pdfByteHex(value){
  const special={'€':0x80,'‚':0x82,'ƒ':0x83,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,'ˆ':0x88,'‰':0x89,'Š':0x8a,'‹':0x8b,'Œ':0x8c,'Ž':0x8e,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97,'˜':0x98,'™':0x99,'š':0x9a,'›':0x9b,'œ':0x9c,'ž':0x9e,'Ÿ':0x9f};
  return Array.from(String(value??''),ch=>{let n=special[ch];if(n===undefined){let cp=ch.codePointAt(0);n=(cp>=32&&cp<=126)||(cp>=160&&cp<=255)?cp:63;}return n.toString(16).padStart(2,'0')}).join('').toUpperCase();
}
function makeLocalPDF(filename, title, subtitle, draw){
  const W=595.28,H=841.89,pages=[];let cmds=[],y=58,pageNo=0;
  const navy='22223B',slate='4A4E69',mauve='9A8C98',cream='F2E9E4',line='E5D9D4',dark='34313A',muted='77717A';
  function raw(s){cmds.push(s)}
  function color(hex){return [0,2,4].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(n=>n.toFixed(3)).join(' ')}
  function rect(x,top,w,h,fill,stroke){let c='';if(fill)c+=color(fill)+' rg ';if(stroke)c+=color(stroke)+' RG ';raw(`${c}${x.toFixed(2)} ${(H-top-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${fill&&stroke?'B':fill?'f':'S'}`)}
  function lineAt(x1,top1,x2,top2,hex=line){raw(`${color(hex)} RG 0.7 w ${x1.toFixed(2)} ${(H-top1).toFixed(2)} m ${x2.toFixed(2)} ${(H-top2).toFixed(2)} l S`)}
  function txt(x,top,str,size=10,hex=dark,bold=false){raw(`${color(hex)} rg BT /${bold?'F2':'F1'} ${size} Tf 1 0 0 1 ${x.toFixed(2)} ${(H-top).toFixed(2)} Tm <${pdfByteHex(str)}> Tj ET`)}
  function wrap(str,maxChars){let words=String(str??'').split(/\s+/),out=[],cur='';for(const word of words){let test=cur?cur+' '+word:word;if(test.length>maxChars&&cur){out.push(cur);cur=word}else cur=test;}if(cur)out.push(cur);return out.length?out:[''];}
  function ensure(h=24){if(y+h>790)newPage()}
  function newPage(){if(cmds.length)pages.push(cmds.join('\n'));cmds=[];pageNo++;rect(0,0,W,76,navy);txt(38,31,'MY BUDGET',17,'F2E9E4',true);txt(38,51,subtitle,8,'D9D2D1',false);txt( W-42,31,String(pageNo).padStart(2,'0'),9,'C9ADA7',true);lineAt(38,76,W-38,76,'C9ADA7');y=105;}
  function section(label){ensure(35);txt(38,y,label.toUpperCase(),9,mauve,true);y+=10;lineAt(38,y,W-38,y,line);y+=16;}
  function paragraph(str,size=9,hex=dark){let lines=wrap(str,Math.max(35,Math.floor(510/(size*.53))));for(let l of lines){ensure(15);txt(40,y,l,size,hex,false);y+=14;}}
  function metricCards(items){let gap=10,w=(W-76-gap)/2,h=52;for(let i=0;i<items.length;i+=2){ensure(h+10);items.slice(i,i+2).forEach((it,j)=>{let x=38+j*(w+gap);rect(x,y,w,h,'F7F3F1','E9DFDA');txt(x+12,y+17,it[0],8,mauve,true);let val=String(it[1]);let fs=val.length>24?10:13;txt(x+12,y+38,val,fs,navy,true)});y+=h+9;}}
  function row(left,right,opts={}){ensure(25);let lines=wrap(left,Math.max(22,Math.floor(350/5.1)));if(lines.length>1){txt(40,y,lines[0],8.5,dark,false);y+=12;for(let l of lines.slice(1)){txt(40,y,l,8.5,dark,false);y+=12;}txt( W-40-Math.min(180,String(right).length*5.1),y-12,String(right),8.5,opts.color||navy,true)}else{txt(40,y,left,8.5,dark,false);txt(W-40-Math.min(190,String(right).length*5.1),y,String(right),8.5,opts.color||navy,true);y+=14;}lineAt(40,y-4,W-40,y-4,'EEE7E3');y+=5;}
  function start(titleText){newPage();txt(38,y,titleText,19,navy,true);y+=25;}
  function finish(){pages.push(cmds.join('\n'));let objs=[];const add=o=>(objs.push(o),objs.length);add('<< /Type /Catalog /Pages 2 0 R >>');add('');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');let pageIds=[];pages.forEach(content=>{let stream=content+'\n';let streamId=add(`<< /Length ${stream.length} >>\nstream\n${stream}endstream`);let pageId=add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${streamId} 0 R >>`);pageIds.push(pageId)});objs[1]=`<< /Type /Pages /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;let pdf='%PDF-1.4\n%MyBudget\n',offsets=[0];objs.forEach((o,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});let xref=pdf.length;pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;for(let i=1;i<offsets.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';pdf+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;let blob=new Blob([pdf],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
  newPage();txt(38,y,title,20,navy,true);y+=25;paragraph(subtitle,9,muted);y+=5;draw({txt,rect,lineAt,section,paragraph,metricCards,row,ensure,get y(){return y},set y(v){y=v},newPage,navy,slate,mauve,cream});finish();
}
function exportMonthlyPDF(k){let m=month(k),fixed=fixedTotal(m),savIn=m.savings.filter(x=>x.type==='in').reduce((s,t)=>s+Number(t.amount||0),0),savOut=m.savings.filter(x=>x.type==='out').reduce((s,t)=>s+Number(t.amount||0),0),cats=allCategories(m),total=Object.values(cats).reduce((a,b)=>a+b,0),transactions=m.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date));makeLocalPDF(`My-Budget-${k}.pdf`,`Fiche mensuelle · ${monthLabel(k)}`,`Bilan personnel de ${db.profile.name} · Généré le ${new Date().toLocaleDateString('fr-FR')}`,p=>{
    p.rect(38,p.y,519,82,'F2E9E4');p.txt(54,p.y+22,'SOLDE FINAL DISPONIBLE',8,'9A8C98',true);p.txt(54,p.y+53,money(balance(m),db.profile.currency),22,'22223B',true);p.txt(54,p.y+70,`Salaire : ${money(m.salary,db.profile.currency)}  ·  Payé le : ${dateLocal(m.paidAt).toLocaleDateString('fr-FR')}`,8,'4A4E69');p.y+=99;
    p.metricCards([['DÉPENSES FIXES',money(fixed,db.profile.currency)],['DÉPENSES PONCTUELLES',money(txSum(m),db.profile.currency)],['ÉPARGNE DÉPOSÉE',money(savIn,db.profile.currency)],['RETRAITS D’ÉPARGNE',money(savOut,db.profile.currency)],['REPORT D’ÉPARGNE',money(m.carryoverAmount||0,db.profile.currency)]]);
    p.section('Répartition des dépenses');if(Object.keys(cats).length){Object.entries(cats).sort((a,b)=>b[1]-a[1]).forEach(([name,value])=>p.row(`${name} · ${total?Math.round(value/total*100):0}%`,money(value,db.profile.currency)))}else p.paragraph('Aucune dépense enregistrée pour ce mois.');
    p.section('Journal des dépenses ponctuelles');if(transactions.length)transactions.forEach(t=>p.row(`${dateLocal(t.date).toLocaleDateString('fr-FR')} · ${t.description} (${t.category})`,`− ${money(t.amount,db.profile.currency)}`,{color:'A44A55'}));else p.paragraph('Aucun mouvement enregistré.');
    p.section('Mouvements d’épargne');if(m.savings.length)m.savings.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>p.row(`${dateLocal(s.date).toLocaleDateString('fr-FR')} · ${s.description}`,`${s.type==='in'?'+':'−'} ${money(s.amount,db.profile.currency)}`,{color:s.type==='in'?'52796F':'A44A55'}));else p.paragraph('Aucun mouvement d’épargne.');
    p.y+=8;p.paragraph('Les montants présentés correspondent aux opérations enregistrées dans My Budget. Les dépenses fixes sont provisionnées automatiquement dans le solde.',8,'77717A');
  });toast('Votre fiche mensuelle PDF a été téléchargée.');}
function exportAnnualPDF(year){let keys=Object.keys(db.months||{}).filter(k=>k.startsWith(year+'-')).sort(),months=keys.map(k=>({k,m:month(k)})),income=months.reduce((s,x)=>s+Number(x.m.salary||0),0),fixed=months.reduce((s,x)=>s+fixedTotal(x.m),0),variable=months.reduce((s,x)=>s+txSum(x.m),0),saveIn=months.reduce((s,x)=>s+x.m.savings.filter(t=>t.type==='in').reduce((a,t)=>a+Number(t.amount||0),0),0),saveOut=months.reduce((s,x)=>s+x.m.savings.filter(t=>t.type==='out').reduce((a,t)=>a+Number(t.amount||0),0),0),finalBalance=months.reduce((s,x)=>s+balance(x.m),0);
  makeLocalPDF(`My-Budget-Bilan-${year}.pdf`,`Bilan annuel · ${year}`,`Synthèse financière de ${db.profile.name} · Généré le ${new Date().toLocaleDateString('fr-FR')}`,p=>{p.metricCards([['REVENUS ENREGISTRÉS',money(income,db.profile.currency)],['DÉPENSES FIXES',money(fixed,db.profile.currency)],['DÉPENSES PONCTUELLES',money(variable,db.profile.currency)],['DÉPÔTS D’ÉPARGNE',money(saveIn,db.profile.currency)],['RETRAITS D’ÉPARGNE',money(saveOut,db.profile.currency)],['SOLDES MENSUELS CUMULÉS',money(finalBalance,db.profile.currency)]]);p.section('Évolution mensuelle');if(months.length)months.forEach(({k,m})=>p.row(monthLabel(k),`Solde : ${money(balance(m),db.profile.currency)}`));else p.paragraph('Aucune donnée enregistrée pour cette année.');p.section('Bilan et méthode');p.paragraph(`Dépenses totales fixes et ponctuelles : ${money(fixed+variable,db.profile.currency)}.`);p.paragraph(`Épargne nette constituée sur l’année : ${money(saveIn-saveOut,db.profile.currency)}.`);p.paragraph('Les données reflètent uniquement les mois et opérations enregistrés dans cette application. Les soldes mensuels sont affichés séparément et ne doivent pas être additionnés pour représenter un solde bancaire réel.',8,'77717A');});toast('Votre bilan annuel PDF a été téléchargé.');}

function checkSavingsCarryover(){
 if(!db.profile||!db.months||!db.months[currentKey])return;
 let m=db.months[currentKey];if(m.carryoverDecision!==undefined)return;
 let prev=previousMonth(currentKey),pm=db.months[prev];if(!pm)return;
 let amount=Math.max(0,savingNet({savings:Array.isArray(pm.savings)?pm.savings:[]}));if(amount<=0){m.carryoverDecision=false;m.carryoverAmount=0;save();return;}
 showModal(`<h2>Reporter l'épargne ?</h2><p>Il reste <strong>${money(amount,db.profile.currency)}</strong> d'épargne provenant de ${monthLabel(prev)}.</p><p>Souhaitez-vous la faire apparaître dans le mouvement d'épargne de ${monthLabel(currentKey)} ? Elle restera identifiée comme provenant de ${monthLabel(prev)} et ne sera pas ajoutée au solde disponible pour les dépenses.</p><div class="modalfoot"><button class="btn ghost" onclick="answerCarryover(false,'${prev}')">Non</button><button class="btn" onclick="answerCarryover(true,'${prev}')">Oui, reporter</button></div>`);
}
function answerCarryover(yes,prev){let m=db.months[currentKey];m.carryoverDecision=!!yes;m.carryoverFrom=yes?prev:null;m.carryoverAmount=yes?Math.max(0,savingNet({savings:db.months[prev]?.savings||[]})):0;save();closeModal();if(page==='savings')render();toast(yes?'Épargne précédente reportée dans le suivi.':'Aucun report effectué.');}

function openNotifications(){let end=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();let day=now.getDate();let last=day>=end-2;let first=day<=3;let annual=now.getMonth()===11&&day>=18;showModal(`<h2>Vos rappels</h2>${annual?'<div class="notice">Bilan annuel disponible.</div>':''}${last?'<div class="notice">Fin de mois : vérifiez vos mouvements.</div>':''}${first?'<div class="notice">Consultez la fiche du mois précédent.</div>':''}<div class="actions"><button class="btn" onclick="closeModal();go('history');openReport('${previousMonth(currentKey)}')">Fiche précédente</button></div><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Fermer</button></div>`)}
function previousMonth(k){let [y,m]=k.split('-').map(Number);let d=new Date(y,m-2,1);return keyOf(d)}
function requestNotify(){if(!('Notification'in window))return toast('Notifications non prises en charge par ce navigateur.');Notification.requestPermission().then(p=>{toast(p==='granted'?'Notifications autorisées.':'Autorisation non accordée.');if(p==='granted')new Notification('My Budget',{body:'Les rappels seront visibles lorsque vous utiliserez votre application.'})})}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-budget-sauvegarde-'+currentKey+'.json';a.click();URL.revokeObjectURL(url)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.profile||!d.months)throw Error();if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;db=d;save();render();toast('Sauvegarde restaurée.')}catch(err){toast('Fichier de sauvegarde invalide.')}};r.readAsText(f)}
function checkReminders(){if(!db.profile)return;let today=new Date(),k=keyOf(today),stamp=today.toISOString().slice(0,10),last= new Date(today.getFullYear(),today.getMonth()+1,0).getDate();let seen=JSON.parse(localStorage.getItem('mybudget_reminders')||'{}');let type=today.getMonth()===11&&today.getDate()>=18?'annual':today.getDate()<=3?'start':today.getDate()>=last-2?'end':'';if(type&&seen[stamp]!==type){seen[stamp]=type;localStorage.setItem('mybudget_reminders',JSON.stringify(seen));setTimeout(()=>{if(type==='annual')showModal(`<h2>✨ Votre bilan annuel</h2><div class="modalfoot"><button class="btn" onclick="closeModal();annualReport()">Voir mon bilan annuel</button></div>`);else if(type==='start')showModal(`<h2>Nouveau mois !</h2><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Plus tard</button><button class="btn" onclick="closeModal();openReport('${previousMonth(k)}')">Voir la fiche</button></div>`);else showModal(`<h2>Fin de mois</h2><div class="modalfoot"><button class="btn" onclick="closeModal();openReport('${k}')">Voir mon bilan</button></div>`)},700)}}
function annualReport(year=now.getFullYear()){let keys=Object.keys(db.months||{}).filter(k=>k.startsWith(year+'-')).sort(),months=keys.map(k=>({k,m:month(k)})),income=months.reduce((s,x)=>s+x.m.salary,0),fixed=months.reduce((s,x)=>s+fixedTotal(x.m),0),spend=months.reduce((s,x)=>s+txSum(x.m),0),saveIn=months.reduce((s,x)=>s+x.m.savings.filter(t=>t.type==='in').reduce((a,t)=>a+t.amount,0),0),saveOut=months.reduce((s,x)=>s+x.m.savings.filter(t=>t.type==='out').reduce((a,t)=>a+t.amount,0),0);showModal(`<div class="report" id="annualPrint"><div class="eyebrow">My Budget · Bilan annuel</div><h2>Votre année ${year}</h2><p>Une année de gestion financière de ${escapeHtml(db.profile.name)}</p><div class="grid2"><div class="metric"><div class="eyebrow">Revenus enregistrés</div><div class="num">${money(income,db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Dépenses fixes</div><div class="num">${money(fixed,db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Dépenses ponctuelles</div><div class="num">${money(spend,db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Dépenses totales</div><div class="num">${money(fixed+spend,db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Dépôts d'épargne</div><div class="num">${money(saveIn,db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Retraits d'épargne</div><div class="num">${money(saveOut,db.profile.currency)}</div></div></div><h3>Évolution mensuelle</h3>${months.length?months.map(x=>`<div class="item"><span>${monthLabel(x.k)}</span><strong>${money(balance(x.m),db.profile.currency)}</strong></div>`).join(''):'<p>Aucune donnée pour cette année.</p>'}<p style="font-size:10px;color:#888">Les totaux reflètent les données saisies dans My Budget.</p></div><div class="modalfoot no-print"><button class="btn ghost" onclick="closeModal()">Fermer</button><button class="btn" onclick="exportAnnualPDF(${year})">Télécharger le bilan PDF</button></div>`)}
if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();setTimeout(checkSavingsCarryover,500);checkReminders();
</script></body></html>
