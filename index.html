function renderOnboarding(){applyPalette(draft.palette);let steps=['Profil','Salaire','Dépenses fixes','Protection'];let body='';if(onboardingStep===0)body=`<div class="eyebrow">Étape 1 sur 4</div><h1>Votre profil</h1><div class="field"><label>Nom</label><input id="obName" placeholder="Votre nom" value="${escapeHtml(draft.name)}"></div><div class="field"><label>Devise</label><select id="obCurrency"><option ${draft.currency==='FC'?'selected':''}>FC</option><option ${draft.currency==='USD'?'selected':''}>USD</option><option ${draft.currency==='EUR'?'selected':''}>EUR</option></select></div><div class="field"><label>Palette</label>${paletteChoices(draft.palette,'setup')}</div>`;if(onboardingStep===1)body=`<div class="eyebrow">Étape 2 sur 4</div><h1>Salaire</h1><p class="small muted">Le montant sera attribué au mois de référence que vous choisirez ensuite. Aucune date de paiement n'est nécessaire.</p><div class="field"><label>Montant du salaire</label><input id="obSalary" type="number" min="0" value="${draft.salary}" placeholder="Montant prévu ou reçu"></div>`;if(onboardingStep===2)body=`<div class="eyebrow">Étape 3 sur 4</div><h1>Dépenses fixes</h1><p class="small muted">Les neuf postes habituels sont intégrés. Vous pouvez renseigner leurs montants ou passer cette étape.</p><div id="obFixed">${draft.fixed.map((f,i)=>`<div class="formgrid draftrow"><input class="draftname" value="${escapeHtml(f.name)}" placeholder="Nom"><input class="draftamount" type="number" min="0" value="${f.amount}" placeholder="Montant"></div>`).join('')}</div><button class="btn ghost full" style="margin-top:8px" onclick="skipFixedSetup()">Passer cette étape</button>`;if(onboardingStep===3)body=`<div class="eyebrow">Étape 4 sur 4 · Facultatif</div><h1>Protéger My Budget</h1><p class="small muted">Vous pouvez protéger l'ouverture de l'application avec un code PIN ou un mot de passe. Cette protection reste locale à cet appareil.</p><div class="field"><label>Type de protection</label><select id="obMethod" onchange="toggleOnboardSecret()"><option value="none">Aucune protection</option><option value="pin">Code PIN</option><option value="password">Mot de passe</option></select></div><div id="obSecretFields" class="hidden"><div class="field"><label id="obSecretLabel">Code PIN</label><input id="obSecret" type="password" autocomplete="new-password"></div><div class="field"><label>Confirmer</label><input id="obSecret2" type="password" autocomplete="new-password"></div></div>`;$('#root').innerHTML=`<div class="onboard"><div class="onboardbox"><div class="brand">My <span>Budget</span></div><div class="step">${steps.map((s,i)=>`<i class="${i<=onboardingStep?'done':''}"></i>`).join('')}</div><div class="card">${body}<div class="modalfoot">${onboardingStep?'<button class="btn ghost" onclick="onboardBack()">Retour</button>':''}<button class="btn" onclick="onboardNext()">${onboardingStep===3?'Terminer':'Continuer'}</button></div></div></div></div>`}

async function hashSecret(secret,salt){let enc=new TextEncoder(),key=await crypto.subtle.importKey('raw',enc.encode(secret),'PBKDF2',false,['deriveBits']);let bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:120000,hash:'SHA-256'},key,256);return btoa(String.fromCharCode(...new Uint8Array(bits)))}

function drawChart(m){let cats=expenseTotals(m),entries=Object.entries(cats).filter(x=>x[1]>0),canvas=$('#donut');if(!canvas)return;let ctx=canvas.getContext('2d'),total=entries.reduce((s,x)=>s+x[1],0),cx=160,cy=160,r=126,inner=78;ctx.clearRect(0,0,320,320);if(!entries.length){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='#e7ddda';ctx.lineWidth=38;ctx.stroke();ctx.fillStyle='#4A4E69';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText('0',cx,cy+7)}else{let a=-Math.PI/2;entries.forEach(([n,v],i)=>{let b=a+v/total*Math.PI*2;ctx.beginPath();ctx.arc(cx,cy,r,a,b);ctx.arc(cx,cy,inner,b,a,true);ctx.closePath();ctx.fillStyle=chartPalette[i%chartPalette.length];ctx.fill();a=b});ctx.fillStyle='#22223B';ctx.textAlign='center';ctx.font='bold 20px sans-serif';ctx.fillText(Math.round(total).toLocaleString('fr-FR'),cx,cy+4);ctx.font='11px sans-serif';ctx.fillText('DÉPENSÉ',cx,cy+22)}$('#legend').innerHTML=entries.length?entries.map(([n,v],i)=>`<div class="legend-row"><span><i class="dot" style="background:${chartPalette[i%chartPalette.length]}"></i>${escapeHtml(n)}</span><strong>${Math.round(v/total*100)}%</strong></div>`).join(''):'<div class="small muted">Les dépenses apparaîtront ici.</div>'}

function savingsView(m){
 let total=savingsBalance(selectedMonth), rows=savingsByMonth(selectedMonth);
 let withdrawals=Object.entries(db.months||{}).filter(([k])=>k<=selectedMonth).flatMap(([k,x])=>(x.savingWithdrawals||[]).map(w=>({k,...w}))).sort((a,b)=>b.k.localeCompare(a.k));
 let creditDraws=(db.credits||[]).flatMap(c=>(c.payments||[]).filter(p=>p.source==='savings'&&p.recordMonth<=selectedMonth).map(p=>({name:c.name,k:p.recordMonth,amount:p.amount}))).sort((a,b)=>b.k.localeCompare(a.k));
 let monthAmount=m.savingContribution==null?'Non définie':money(contribution(m),db.profile.currency);
 let contributionBlock=m.savingContribution==null
   ? `<p class="small muted">Définissez une seule fois le montant que vous souhaitez mettre de côté pour ce mois. Cette contribution sera ajoutée au cumul.</p><button class="btn full" onclick="defineContribution()" ${!isEditable()?'disabled':''}>Définir l'épargne du mois</button>`
   : `<div class="item"><span>Contribution enregistrée · définitive</span><strong>${money(contribution(m),db.profile.currency)}</strong></div><span class="pill">Déjà définie · non modifiable</span>`;
 let monthRows=rows.length?`<div class="list">${rows.map(x=>`<div class="item"><div><div class="item-title">${monthLabel(x.k)}</div><div class="small muted">Constituée : ${money(x.contributed,db.profile.currency)}</div></div><div style="text-align:right"><strong>${money(x.remaining,db.profile.currency)}</strong><div class="small muted">Restant</div></div></div>`).join('')}</div><p class="small muted">Les retraits et remboursements sont imputés aux contributions les plus anciennes en premier.</p>`:'<div class="empty">Aucune contribution enregistrée avant ce mois.</div>';
 let withdrawalRows=withdrawals.map(w=>`<div class="item"><div><div class="item-title">${escapeHtml(w.description||'Retrait')}</div><div class="small muted">${monthLabel(w.k)}</div></div><strong class="negative">− ${money(w.amount,db.profile.currency)}</strong></div>`).join('');
 let creditRows=creditDraws.map(w=>`<div class="item"><div><div class="item-title">Remboursement : ${escapeHtml(w.name)}</div><div class="small muted">${monthLabel(w.k)}</div></div><strong class="negative">− ${money(w.amount,db.profile.currency)}</strong></div>`).join('');
 let movements=withdrawalRows+creditRows||'<div class="empty">Aucun retrait ou remboursement prélevé sur l’épargne.</div>';
 return `<div class="section-head"><h2>Épargne</h2><span class="pill">${monthLabel(selectedMonth)}</span></div><div class="card hero"><div class="eyebrow">Solde cumulé à la fin de ${monthLabel(selectedMonth)}</div><div class="balance">${money(total,db.profile.currency)}</div><div class="hero-meta">Le cumul tient compte des contributions, retraits et remboursements prélevés sur l'épargne.</div></div><div class="grid2"><div class="metric"><div class="eyebrow">Contribution du mois</div><div class="num positive">${monthAmount}</div></div><div class="metric"><div class="eyebrow">Retraits du mois</div><div class="num negative">${money((m.savingWithdrawals||[]).reduce((s,x)=>s+Number(x.amount||0),0),db.profile.currency)}</div></div></div><div class="card" style="margin-top:13px"><h2 style="margin-top:0">Épargne de ${monthLabel(selectedMonth)}</h2>${contributionBlock}<div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="openSavingsWithdrawal()" ${!isEditable()?'disabled':''}>Retirer de l'épargne</button></div></div><div class="section-head"><h2>Épargne par mois d'origine</h2></div><div class="card">${monthRows}</div><div class="section-head"><h2>Retraits et remboursements</h2></div><div class="card">${movements}</div>${closedFooter()}`;
}
function defineContribution(){if(!needEdit())return;showModal(`<h2>Épargne de ${monthLabel(selectedMonth)}</h2><p>Cette contribution ne pourra plus être modifiée après validation.</p><div class="field"><label>Montant à mettre de côté</label><input id="savingContributionInput" type="number" min="0" value=""></div><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveContribution()">Confirmer définitivement</button></div>`)}function saveContribution(){let v=Number($('#savingContributionInput').value);if(!Number.isFinite(v)||v<0)return toast('Montant invalide.');let m=ensureMonth(selectedMonth);if(m.savingContribution!=null)return toast('Cette contribution est déjà définie.');m.savingContribution=v;markDirty();closeModal();render();toast('Contribution d’épargne enregistrée.')}
function openSavingsWithdrawal(){if(!needEdit())return;showModal(`<h2>Retirer de l'épargne</h2><div class="field"><label>Montant</label><input id="withdrawAmount" type="number" min="1"></div><div class="field"><label>Motif (facultatif)</label><input id="withdrawNote" placeholder="Motif du retrait"></div><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveWithdrawal()">Confirmer</button></div>`)}function saveWithdrawal(){let a=Number($('#withdrawAmount').value),note=$('#withdrawNote').value.trim();if(a<=0||a>savingsBalance(selectedMonth))return toast('Montant supérieur au solde cumulé disponible.');ensureMonth(selectedMonth).savingWithdrawals.push({id:uid(),amount:a,description:note||'Retrait d’épargne'});markDirty();closeModal();render()}
function visibleCredits(k=selectedMonth){return (db.credits||[]).filter(c=>{if(c.createdMonth>k)return false;let settled=creditSettledMonth(c);return !settled||k<=settled})}
function creditsView(){let credits=visibleCredits(),html=credits.map(c=>{let remaining=creditRemaining(c),payments=paymentsForCredit(c);return `<div class="credit-card"><div class="row"><div><div class="item-title">${escapeHtml(c.name)}</div><div class="small muted">Créé en ${monthLabel(c.createdMonth)}</div></div><span class="pill">${remaining<=0?'Réglé':'En cours'}</span></div><div class="grid2" style="margin:12px 0"><div class="metric"><div class="eyebrow">Montant initial</div><div class="num">${money(c.initialAmount,db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Reste à payer</div><div class="num ${remaining?'negative':'positive'}">${money(remaining,db.profile.currency)}</div></div></div><div class="small muted">${payments.length} remboursement(s) enregistré(s)</div>${remaining>0?`<div class="field" style="margin-top:10px"><label>Actions sur ce crédit</label><select onchange="if(this.value==='pay')openCreditPayment('${c.id}');this.value=''" ${!isEditable()?'disabled':''}><option value="">Choisir une action…</option><option value="pay">Effectuer un remboursement</option></select></div>`:''}<div class="list">${payments.map(p=>`<div class="item"><div><div class="item-title">${money(p.amount,db.profile.currency)}</div><div class="small muted">${dateDisplay(p.date)} · ${p.source==='savings'?'Épargne cumulée':`Solde de ${monthLabel(p.sourceMonth)}`}</div></div></div>`).join('')}</div></div>`}).join('');return `<div class="section-head"><h2>Crédits</h2><button class="btn" onclick="openCredit()" ${!isEditable()?'disabled':''}>＋ Nouveau crédit</button></div>${html||'<div class="card empty">Aucun crédit en cours pour ce mois.</div>'}${closedFooter()}`}
function dateDisplay(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('fr-FR')}
function openCredit(){if(!needEdit())return;showModal(`<h2>Nouveau crédit</h2><div class="field"><label>Nom du crédit</label><input id="creditName" placeholder="Ex. Crédit téléphone"></div><div class="field"><label>Montant initial</label><input id="creditAmount" type="number" min="1"></div><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveCredit()">Créer le crédit</button></div>`)}function saveCredit(){let name=$('#creditName').value.trim(),amount=Number($('#creditAmount').value);if(!name||amount<=0)return toast('Indiquez un nom et un montant positif.');ensureMonth(selectedMonth);db.credits.push({id:uid(),name,initialAmount:amount,createdMonth:selectedMonth,payments:[]});markDirty();closeModal();render()}
function openCreditPayment(id){if(!needEdit())return;let c=db.credits.find(x=>x.id===id),remaining=creditRemaining(c),opts=monthOptions().filter(k=>k<=selectedMonth);showModal(`<h2>Rembourser « ${escapeHtml(c.name)} »</h2><p class="small muted">Reste à payer : ${money(remaining,db.profile.currency)}</p><div class="field"><label>Montant du remboursement</label><input id="cpAmount" type="number" min="1" max="${remaining}"></div><div class="field"><label>Date réelle du remboursement</label><input id="cpDate" type="date" max="${todayISO()}" value="${todayISO()}"><div class="small muted">La date ne peut pas être dans le futur. Le remboursement reste rattaché au mois consulté.</div></div><div class="field"><label>Source des fonds</label><select id="cpSource" onchange="toggleCreditSource()"><option value="savings">Épargne cumulée (${money(savingsBalance(selectedMonth),db.profile.currency)})</option><option value="month">Solde d'un mois précis</option></select></div><div id="cpMonthWrap" class="field hidden"><label>Mois dont le solde sera utilisé</label><select id="cpMonth">${opts.map(k=>`<option value="${k}" ${k===selectedMonth?'selected':''}>${monthLabel(k)} · ${money(monthBalance(k,selectedMonth),db.profile.currency)}</option>`).join('')}</select></div><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveCreditPayment('${id}')">Enregistrer le remboursement</button></div>`)}function toggleCreditSource(){$('#cpMonthWrap').classList.toggle('hidden',$('#cpSource').value!=='month')}
function saveCreditPayment(id){let c=db.credits.find(x=>x.id===id),amount=Number($('#cpAmount').value),date=$('#cpDate').value,source=$('#cpSource').value,sourceMonth=source==='month'?$('#cpMonth').value:null;if(!date||date>todayISO())return toast('Choisissez une date réelle, qui n’est pas encore arrivée.');if(amount<=0||amount>creditRemaining(c))return toast('Vérifiez le montant du remboursement.');if(source==='savings'&&amount>savingsBalance(selectedMonth))return toast('Le solde cumulé de l’épargne est insuffisant.');if(source==='month'&&amount>Math.max(0,monthBalance(sourceMonth,selectedMonth)))return toast('Le solde disponible de ce mois est insuffisant.');ensureMonth(selectedMonth);c.payments.push({id:uid(),amount,date,source,sourceMonth,recordMonth:selectedMonth});markDirty();closeModal();render();toast('Remboursement enregistré.')}
function closedFooter(){return db.months?.[selectedMonth]?.closed&&!editUnlocked?`<div class="card bottom-actions"><button class="btn full" onclick="unlockMonthEdit()">Modifier ce mois</button></div>`:''}
function unlockMonthEdit(){editUnlocked=true;render();toast('Mode modification activé. Le mois restera clôturé.')}
function closeMonth(){if(selectedMonth!==db.referenceMonth)return toast('Seul le mois de référence peut être clôturé.');let next=addMonth(selectedMonth);if(!monthOptions().includes(next))return toast('Le mois suivant ne sera disponible que pendant la dernière semaine du mois réel en cours.');showModal(`<h2>Clôturer ${monthLabel(selectedMonth)} ?</h2><p>Le mois sera marqué comme clôturé et ${monthLabel(next)} deviendra votre nouveau mois de référence. Vous pourrez toujours modifier ce mois plus tard.</p><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="confirmCloseMonth('${next}')">Clôturer le mois</button></div>`)}function confirmCloseMonth(next){ensureMonth(selectedMonth).closed=true;db.referenceMonth=next;referenceMonth=next;ensureMonth(next,true);selectedMonth=next;editUnlocked=false;dirty=false;save();monthSnapshot=clone(db);closeModal();render();toast('Nouveau mois de référence : '+monthLabel(next))}
function settingsView(){return `<div class="section-head"><h2>Paramètres</h2></div><div class="card"><div class="eyebrow">Mois de référence</div><h2 style="margin:5px 0">${monthLabel(db.referenceMonth)}</h2><p class="small muted">Le mois de référence sert de point de départ. Vous pouvez le changer à tout moment parmi les mois autorisés.</p><button class="btn secondary" onclick="changeReference()">Changer le mois de référence</button></div><div class="card"><div class="eyebrow">Apparence</div><h2>Palette de couleurs</h2>${paletteChoices(activePalette(),'settings')}</div><div class="card"><h2 style="margin-top:0">Profil</h2><div class="field"><label>Nom</label><input id="setName" value="${escapeHtml(db.profile.name)}"></div><div class="field"><label>Devise</label><select id="setCurrency">${['FC','USD','EUR'].map(x=>`<option ${db.profile.currency===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn" onclick="saveProfile()">Enregistrer</button></div><div class="card"><div class="row"><h2>Dépenses fixes</h2><button class="btn smallbtn" onclick="addFixedTemplate()">＋ Ajouter</button></div><p class="small muted">L'ordre choisi ici est repris dans les fiches de chaque mois. Les postes intégrés ne peuvent pas être supprimés.</p><div class="list">${db.fixed.map((f,i)=>`<div class="item"><div style="flex:1"><div class="item-title">${escapeHtml(f.name)}</div><div class="small muted">Montant par défaut : ${money(f.amount,db.profile.currency)}</div></div><div class="actions"><button class="btn ghost smallbtn" onclick="moveFixed('${f.id}',-1)" ${i===0?'disabled':''}>↑</button><button class="btn ghost smallbtn" onclick="moveFixed('${f.id}',1)" ${i===db.fixed.length-1?'disabled':''}>↓</button><button class="btn ghost smallbtn" onclick="editFixedTemplate('${f.id}')">Modifier</button>${f.builtin?'<span class="pill">Intégrée</span>':`<button class="btn danger smallbtn" onclick="removeFixedTemplate('${f.id}')">×</button>`}</div></div>`).join('')}</div></div><div class="card"><h2 style="margin-top:0">Protection</h2><p class="small muted">${db.security?`Protection active : ${db.security.method==='pin'?'code PIN':'mot de passe'}.`:'Aucune protection activée.'}</p><div class="actions"><button class="btn secondary" onclick="configureSecurity()">${db.security?'Modifier':'Activer'} la protection</button>${db.security?'<button class="btn danger" onclick="removeSecurity()">Désactiver</button>':''}</div></div><div class="card"><h2 style="margin-top:0">Sauvegarde</h2><p class="small muted">Exportez une copie de vos données ou restaurez une sauvegarde.</p><div class="actions"><button class="btn secondary" onclick="backup()">Exporter</button><label class="btn ghost">Importer<input type="file" accept="application/json" onchange="restore(event)" hidden></label></div></div>${selectedMonth!==db.referenceMonth?`<button class="btn ghost full" onclick="returnToReference()">Revenir à mon mois de référence</button>`:''}${closedFooter()}`}
function changeReference(){showModal(`<h2>Changer le mois de référence</h2><div class="field"><label>Nouveau mois de référence</label><select id="newReference">${monthOptions().map(k=>`<option value="${k}" ${k===db.referenceMonth?'selected':''}>${monthLabel(k)}</option>`).join('')}</select></div><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveReference()">Confirmer</button></div>`)}function saveReference(){let k=$('#newReference').value;if(!monthOptions().includes(k))return toast('Mois non disponible.');db.referenceMonth=k;referenceMonth=k;selectedMonth=k;ensureMonth(k);dirty=false;monthSnapshot=clone(db);save();closeModal();render()}
function saveProfile(){let n=$('#setName').value.trim();if(!n)return toast('Le nom est obligatoire.');db.profile.name=n;db.profile.currency=$('#setCurrency').value;save();if(!dirty)monthSnapshot=clone(db);render()}
function editFixedTemplate(id){let f=db.fixed.find(x=>x.id===id);showModal(`<h2>Modifier ${escapeHtml(f.name)}</h2><div class="field"><label>Nom</label><input id="ftName" value="${escapeHtml(f.name)}" ${f.builtin?'disabled':''}></div><div class="field"><label>Montant par défaut</label><input id="ftAmount" type="number" min="0" value="${f.amount}"></div><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveFixedTemplate('${id}')">Enregistrer</button></div>`)}function saveFixedTemplate(id){let f=db.fixed.find(x=>x.id===id),n=$('#ftName').value.trim(),a=Number($('#ftAmount').value);if(!n||a<0)return toast('Vérifiez les informations.');f.name=n;f.amount=a;save();if(!dirty)monthSnapshot=clone(db);closeModal();render()}function addFixedTemplate(){showModal(`<h2>Nouvelle dépense fixe</h2><div class="field"><label>Nom</label><input id="newFixedName"></div><div class="field"><label>Montant par défaut</label><input id="newFixedAmount" type="number" min="0"></div><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveNewFixed()">Ajouter</button></div>`)}function saveNewFixed(){let n=$('#newFixedName').value.trim(),a=Number($('#newFixedAmount').value);if(!n||a<0)return toast('Vérifiez le nom et le montant.');if(db.fixed.some(f=>f.name.toLowerCase()===n.toLowerCase()))return toast('Cette dépense existe déjà.');let fresh={id:uid(),name:n,amount:a,builtin:false};db.fixed.push(fresh);if(isEditable()){let m=ensureMonth(selectedMonth);m.fixedSnapshot.push({...fresh});markDirty()}else{save();if(!dirty)monthSnapshot=clone(db)}closeModal();render()}function removeFixedTemplate(id){let f=db.fixed.find(x=>x.id===id);showModal(`<h2>Supprimer ${escapeHtml(f.name)} des paramètres ?</h2><p>Les anciennes fiches conservent leur poste.</p><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn danger" onclick="confirmRemoveFixed('${id}')">Supprimer</button></div>`)}function confirmRemoveFixed(id){db.fixed=db.fixed.filter(x=>x.id!==id);save();if(!dirty)monthSnapshot=clone(db);closeModal();render()}
async function configureSecurity(){let method=db.security?.method||'none';showModal(`<h2>Protection de l'application</h2><div class="field"><label>Type</label><select id="secMethod" onchange="toggleSecFields()"><option value="none" ${method==='none'?'selected':''}>Aucune protection</option><option value="pin" ${method==='pin'?'selected':''}>Code PIN</option><option value="password" ${method==='password'?'selected':''}>Mot de passe</option></select></div><div id="secFields" class="${method==='none'?'hidden':''}"><div class="field"><label id="secLabel">${method==='password'?'Mot de passe':'Code PIN'}</label><input id="secValue" type="password" autocomplete="new-password"></div><div class="field"><label>Confirmer</label><input id="secConfirm" type="password"></div></div><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="saveSecuritySettings()">Enregistrer</button></div>`)}function toggleSecFields(){$('#secFields').classList.toggle('hidden',$('#secMethod').value==='none');$('#secLabel').textContent=$('#secMethod').value==='pin'?'Code PIN':'Mot de passe'}async function saveSecuritySettings(){let method=$('#secMethod').value;if(method==='none'){delete db.security;save();closeModal();render();return}let s=$('#secValue').value;if(s!==$('#secConfirm').value)return toast('Les deux saisies doivent être identiques.');if(method==='pin'&&!/^\d{4,8}$/.test(s))return toast('Le PIN doit contenir 4 à 8 chiffres.');if(method==='password'&&s.length<6)return toast('Mot de passe trop court.');try{await setSecurity(method,s);save();closeModal();render();toast('Protection mise à jour.')}catch(e){toast(e.message)}}function removeSecurity(){showModal(`<h2>Désactiver la protection ?</h2><p>Il faudra confirmer votre choix.</p><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn danger" onclick="confirmRemoveSecurity()">Désactiver</button></div>`)}function confirmRemoveSecurity(){delete db.security;save();closeModal();render()}
function openNotifications(){let d=monthDate(selectedMonth);d.setMonth(d.getMonth()-1);let prev=keyOf(d),available=monthOptions().includes(prev);showModal(`<h2>Rappels</h2><p class="small muted">Les rappels suivent le mois que vous consultez.</p><div class="card"><div class="item-title">Fiche du mois précédent</div><p>${monthLabel(prev)}</p>${available?`<button class="btn full" onclick="closeModal();switchMonth('${prev}')">Consulter ce mois</button>`:'<p class="small muted">Janvier 2020 est le premier mois disponible dans My Budget.</p>'}</div><div class="card"><div class="item-title">Bilan annuel</div><button class="btn secondary full" onclick="closeModal();annualReport(${Number(selectedMonth.slice(0,4))})">Voir le bilan ${selectedMonth.slice(0,4)}</button></div><div class="modalfoot"><button class="btn ghost" onclick="closeModal()">Fermer</button></div>`)}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-budget-sauvegarde.json';a.click();URL.revokeObjectURL(url)}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.profile||!d.months)throw Error();if(!confirm('Remplacer les données actuelles ?'))return;db=d;migrate();save();selectedMonth=db.referenceMonth||null;monthSnapshot=null;dirty=false;start()}catch(x){toast('Sauvegarde invalide.')}};r.readAsText(f)}
function monthlyReport(k){let m=month(k),fixed=displayFixed(m),active=visibleCredits(k),tx=m.transactions||[],ft=fixedTotal(m),mt=txSum(m);let creditPayments=(db.credits||[]).flatMap(c=>c.payments||[]).filter(p=>p.recordMonth===k).reduce((s,p)=>s+Number(p.amount||0),0);let fixedBars=fixed.map(f=>`<div class="annual-bar-row"><div class="row"><span>${escapeHtml(f.name)}</span><strong>${money(f.amount,db.profile.currency)}</strong></div><div class="bartrack"><i style="width:${ft?f.amount/ft*100:0}%"></i></div></div>`).join('')||'<p>Aucune dépense fixe chiffrée.</p>';let grouped={};tx.forEach(t=>grouped[t.name]=(grouped[t.name]||0)+Number(t.amount||0));let mobileBars=Object.entries(grouped).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="annual-bar-row"><div class="row"><span>${escapeHtml(n)}</span><strong>${money(v,db.profile.currency)}</strong></div><div class="bartrack"><i style="width:${mt?v/mt*100:0}%"></i></div></div>`).join('')||'<p>Aucune dépense mobile.</p>';showModal(`<div class="report"><div class="eyebrow">My Budget · Fiche mensuelle</div><h2>${monthLabel(k)}</h2><p>Situation financière de ${escapeHtml(db.profile.name)}</p><div class="grid2"><div class="metric"><div class="eyebrow">Salaire</div><div class="num">${money(m.salary,db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Solde disponible</div><div class="num">${money(monthBalance(k,k),db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Dépenses fixes</div><div class="num">${money(ft,db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Dépenses mobiles</div><div class="num">${money(mt,db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Épargne du mois</div><div class="num">${m.savingContribution==null?'Non définie':money(contribution(m),db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Épargne cumulée</div><div class="num">${money(savingsBalance(k),db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Remboursements de crédits</div><div class="num">${money(creditPayments,db.profile.currency)}</div></div></div><h3>Dépenses fixes par poste</h3>${fixedBars}<h3>Dépenses mobiles par nom</h3>${mobileBars}<h3>Crédits visibles</h3>${active.length?active.map(c=>`<div class="item"><span>${escapeHtml(c.name)}</span><strong>Reste : ${money(creditRemaining(c,k),db.profile.currency)}</strong></div>`).join(''):'<p>Aucun crédit.</p>'}</div><div class="modalfoot no-print"><button class="btn ghost" onclick="closeModal()">Fermer</button><button class="btn" onclick="exportMonthlyPDF('${k}')">Télécharger PDF</button></div>`)}
// PDF local, autonome et sans service distant.
function pdfByteHex(value){const special={'€':0x80,'‚':0x82,'ƒ':0x83,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,'ˆ':0x88,'‰':0x89,'Š':0x8a,'‹':0x8b,'Œ':0x8c,'Ž':0x8e,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97,'˜':0x98,'™':0x99,'š':0x9a,'›':0x9b,'œ':0x9c,'ž':0x9e,'Ÿ':0x9f};return Array.from(String(value??''),ch=>{let n=special[ch];if(n===undefined){let cp=ch.codePointAt(0);n=(cp>=32&&cp<=126)||(cp>=160&&cp<=255)?cp:63}return n.toString(16).padStart(2,'0')}).join('').toUpperCase()}
function makeLocalPDF(filename,title,subtitle,draw){const W=595.28,H=841.89,pages=[];let cmds=[],y=58,pageNo=0;const navy='22223B',mauve='9A8C98',line='E5D9D4',dark='34313A',muted='77717A';function raw(s){cmds.push(s)}function color(h){return [0,2,4].map(i=>(parseInt(h.slice(i,i+2),16)/255).toFixed(3)).join(' ')}function rect(x,t,w,h,fill,stroke){let c='';if(fill)c+=color(fill)+' rg ';if(stroke)c+=color(stroke)+' RG ';raw(`${c}${x.toFixed(2)} ${(H-t-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${fill&&stroke?'B':fill?'f':'S'}`)}function lineAt(x1,t1,x2,t2,h=line){raw(`${color(h)} RG 0.7 w ${x1.toFixed(2)} ${(H-t1).toFixed(2)} m ${x2.toFixed(2)} ${(H-t2).toFixed(2)} l S`)}function txt(x,t,s,size=10,h=dark,bold=false){raw(`${color(h)} rg BT /${bold?'F2':'F1'} ${size} Tf 1 0 0 1 ${x.toFixed(2)} ${(H-t).toFixed(2)} Tm <${pdfByteHex(s)}> Tj ET`)}function wrap(s,n){let out=[],cur='';for(let w of String(s??'').split(/\s+/)){let test=cur?cur+' '+w:w;if(test.length>n&&cur){out.push(cur);cur=w}else cur=test}if(cur)out.push(cur);return out.length?out:['']}function newPage(){if(cmds.length)pages.push(cmds.join('\n'));cmds=[];pageNo++;rect(0,0,W,76,navy);txt(38,31,'MY BUDGET',17,'F2E9E4',true);txt(38,51,subtitle,8,'D9D2D1');txt(W-42,31,String(pageNo).padStart(2,'0'),9,'C9ADA7',true);lineAt(38,76,W-38,76,'C9ADA7');y=105}function ensure(h=24){if(y+h>790)newPage()}function section(s){ensure(35);txt(38,y,s.toUpperCase(),9,mauve,true);y+=10;lineAt(38,y,W-38,y);y+=16}function paragraph(s,size=9,h=dark){for(let l of wrap(s,Math.max(35,Math.floor(510/(size*.53))))){ensure(15);txt(40,y,l,size,h);y+=14}}function row(a,b){ensure(25);let lines=wrap(a,68);lines.forEach((l,i)=>{txt(40,y,l,8.5,dark);y+=12});txt(W-40-Math.min(190,String(b).length*5.1),y-12,String(b),8.5,navy,true);lineAt(40,y-4,W-40,y-4,'EEE7E3');y+=5}function metricCards(items){let gap=10,w=(W-86)/2,h=52;for(let i=0;i<items.length;i+=2){ensure(h+10);items.slice(i,i+2).forEach((it,j)=>{let x=38+j*(w+gap);rect(x,y,w,h,'F7F3F1','E9DFDA');txt(x+12,y+17,it[0],8,mauve,true);txt(x+12,y+38,String(it[1]),String(it[1]).length>24?10:13,navy,true)});y+=h+9}}newPage();txt(38,y,title,20,navy,true);y+=25;paragraph(subtitle,9,muted);y+=5;draw({txt,rect,lineAt,section,paragraph,metricCards,row,ensure,get y(){return y},set y(v){y=v}});pages.push(cmds.join('\n'));let objs=[];const add=o=>(objs.push(o),objs.length);add('<< /Type /Catalog /Pages 2 0 R >>');add('');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');let ids=[];pages.forEach(c=>{let st=c+'\n',sid=add(`<< /Length ${st.length} >>\nstream\n${st}endstream`),pid=add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${sid} 0 R >>`);ids.push(pid)});objs[1]=`<< /Type /Pages /Kids [${ids.map(i=>i+' 0 R').join(' ')}] /Count ${ids.length} >>`;let pdf='%PDF-1.4\n%MyBudget\n',offs=[0];objs.forEach((o,i)=>{offs.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});let x=pdf.length;pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;for(let i=1;i<offs.length;i++)pdf+=offs[i].toString().padStart(10,'0')+' 00000 n \n';pdf+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;let blob=new Blob([pdf],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportMonthlyPDF(k){let m=month(k),fixed=displayFixed(m),tx=m.transactions||[],active=visibleCredits(k),grouped={};tx.forEach(t=>grouped[t.name]=(grouped[t.name]||0)+Number(t.amount||0));makeLocalPDF(`My-Budget-${k}.pdf`,`Fiche mensuelle · ${monthLabel(k)}`,`Bilan personnel de ${db.profile.name} · Généré le ${new Date().toLocaleDateString('fr-FR')}`,p=>{p.metricCards([['SALAIRE',money(m.salary,db.profile.currency)],['SOLDE DISPONIBLE',money(monthBalance(k,k),db.profile.currency)],['DÉPENSES FIXES',money(fixedTotal(m),db.profile.currency)],['DÉPENSES MOBILES',money(txSum(m),db.profile.currency)],['ÉPARGNE DU MOIS',m.savingContribution==null?'Non définie':money(contribution(m),db.profile.currency)],['ÉPARGNE CUMULÉE',money(savingsBalance(k),db.profile.currency)]]);p.section('Dépenses fixes par poste');let fmax=Math.max(1,...fixed.map(x=>Number(x.amount||0)));fixed.forEach(f=>{p.row(f.name,money(f.amount,db.profile.currency));p.rect(40,p.y,460*Number(f.amount||0)/fmax,7,'4A4E69');p.y+=12});p.section('Dépenses mobiles par nom');let entries=Object.entries(grouped).sort((a,b)=>b[1]-a[1]),vmax=Math.max(1,...entries.map(x=>x[1]));if(entries.length)entries.forEach(([n,a])=>{p.row(n,money(a,db.profile.currency));p.rect(40,p.y,460*a/vmax,7,'9A8C98');p.y+=12});else p.paragraph('Aucune dépense mobile.');p.section('Crédits visibles');if(active.length)active.forEach(c=>p.row(`${c.name} · initial ${money(c.initialAmount,db.profile.currency)}`,`Reste : ${money(creditRemaining(c,k),db.profile.currency)}`));else p.paragraph('Aucun crédit actif.');p.section('Remboursements enregistrés ce mois');let payments=(db.credits||[]).flatMap(c=>(c.payments||[]).filter(x=>x.recordMonth===k).map(x=>({c,x})));if(payments.length)payments.forEach(({c,x})=>p.row(`${c.name} · ${dateDisplay(x.date)} · ${x.source==='savings'?'Épargne':`Solde ${monthLabel(x.sourceMonth)}`}`,money(x.amount,db.profile.currency)));else p.paragraph('Aucun remboursement.');});toast('Fiche PDF téléchargée.')}
function annualReport(year){let keys=Object.keys(db.months||{}).filter(k=>k.startsWith(year+'-')).sort(),months=keys.map(k=>({k,m:db.months[k]})),income=months.reduce((s,x)=>s+Number(x.m.salary||0),0),fixed=months.reduce((s,x)=>s+fixedTotal(x.m),0),mobile=months.reduce((s,x)=>s+txSum(x.m),0),saved=months.reduce((s,x)=>s+contribution(x.m),0),withdraw=months.reduce((s,x)=>s+(x.m.savingWithdrawals||[]).reduce((a,w)=>a+Number(w.amount||0),0),0),creditSavings=(db.credits||[]).reduce((s,c)=>s+(c.payments||[]).filter(p=>p.recordMonth.startsWith(year+'-')&&p.source==='savings').reduce((a,p)=>a+Number(p.amount||0),0),0),creditPaymentsTotal=(db.credits||[]).reduce((s,c)=>s+(c.payments||[]).filter(p=>p.recordMonth.startsWith(year+'-')).reduce((a,p)=>a+Number(p.amount||0),0),0),fixedRows={},mobileRows={};months.forEach(({m})=>{m.fixedSnapshot.forEach(f=>fixedRows[f.name]=(fixedRows[f.name]||0)+Number(f.amount||0));m.transactions.forEach(t=>mobileRows[t.name]=(mobileRows[t.name]||0)+Number(t.amount||0))});let breakdown=(o,includeZero=false)=>{let arr=Object.entries(o).filter(x=>includeZero||x[1]>0).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...arr.map(x=>x[1]));return arr.map(([n,v])=>`<div class="annual-bar-row"><div class="row"><span>${escapeHtml(n)}</span><strong>${money(v,db.profile.currency)}</strong></div><div class="bartrack"><i style="width:${Math.max(0,Math.min(100,v/max*100))}%"></i></div></div>`).join('')||'<p>Aucune donnée.</p>'};showModal(`<div class="report"><div class="eyebrow">My Budget · Bilan annuel</div><h2>Année ${year}</h2><div class="grid2"><div class="metric"><div class="eyebrow">Salaires</div><div class="num">${money(income,db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Dépenses fixes</div><div class="num">${money(fixed,db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Dépenses mobiles</div><div class="num">${money(mobile,db.profile.currency)}</div></div><div class="metric"><div class="eyebrow">Épargne allouée function exportAnnualPDF(year){let keys=Object.keys(db.months||{}).filter(k=>k.startsWith(year+'-')).sort(),months=keys.map(k=>({k,m:db.months[k]})),income=months.reduce((s,x)=>s+Number(x.m.salary||0),0),fixed=months.reduce((s,x)=>s+fixedTotal(x.m),0),mobile=months.reduce((s,x)=>s+txSum(x.m),0),saved=months.reduce((s,x)=>s+contribution(x.m),0),creditSavings=(db.credits||[]).reduce((s,c)=>s+(c.payments||[]).filter(p=>p.recordMonth.startsWith(year+'-')&&p.source==='savings').reduce((a,p)=>a+Number(p.amount||0),0),0),creditPaymentsTotal=(db.credits||[]).reduce((s,c)=>s+(c.payments||[]).filter(p=>p.recordMonth.startsWith(year+'-')).reduce((a,p)=>a+Number(p.amount||0),0),0);let f={},v={};months.forEach(({m})=>{m.fixedSnapshot.forEach(x=>f[x.name]=(f[x.name]||0)+Number(x.amount||0));m.transactions.forEach(x=>v[x.name]=(v[x.name]||0)+Number(x.amount||0))});makeLocalPDF(`My-Budget-Bilan-${year}.pdf`,`Bilan annuel · ${year}`,`Synthèse de ${db.profile.name} · ${new Date().toLocaleDateString('fr-FR')}`,p=>{p.metricCards([['SALAIRES',money(income,db.profile.currency)],['DÉPENSES FIXES',money(fixed,db.profile.currency)],['DÉPENSES MOBILES',money(mobile,db.profile.currency)],['ÉPARGNE ALLOUÉE',money(saved,db.profile.currency)],['REMBOURSEMENTS CRÉDITS',money(creditPaymentsTotal,db.profile.currency)],['DONT PAR ÉPARGNE',money(creditSavings,db.profile.currency)]]);p.section('Soldes disponibles par mois');months.forEach(x=>p.row(monthLabel(x.k),money(monthBalance(x.k,x.k),db.profile.currency)));p.section('Dépenses fixes par poste');let fixedEntries=Object.entries(f).sort((a,b)=>b[1]-a[1]),fixedMax=Math.max(1,...fixedEntries.map(x=>x[1]));fixedEntries.forEach(([n,a])=>{p.row(n,money(a,db.profile.currency));p.rect(40,p.y,460*a/fixedMax,7,'4A4E69');p.y+=12});p.section('Dépenses mobiles par nom');let mobileEntries=Object.entries(v).sort((a,b)=>b[1]-a[1]),mobileMax=Math.max(1,...mobileEntries.map(x=>x[1]));mobileEntries.forEach(([n,a])=>{p.row(n,money(a,db.profile.currency));p.rect(40,p.y,460*a/mobileMax,7,'9A8C98');p.y+=12});});toast('Bilan annuel PDF téléchargé.')}
function todayISO(){let d=today();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
